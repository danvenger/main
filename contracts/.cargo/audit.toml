# cargo-audit configuration for the Soroban contracts workspace.
# Read automatically by `cargo audit` when run from contracts/ (see
# .github/workflows/security-scans.yml).

[advisories]
ignore = [
  # RUSTSEC-2026-0387: crypto-bigint 0.5.5 timing variability (fix: >=0.7.6).
  #
  # crypto-bigint 0.5.5 is pulled in only through
  #   soroban-sdk 29 -> soroban-env-host 29 -> elliptic-curve 0.13 / k256 / p256
  # soroban-env-host is the *native* host used by `cargo test` and the
  # testutils feature. Contracts built for wasm32 link soroban-env-guest
  # instead, so this code never ships in the deployed WASM; on-chain
  # signature checks run inside the network's own host.
  #
  # No compatible fix exists yet: the newest soroban-env-host (30.0.0)
  # still requires elliptic-curve ^0.13, and crypto-bigint >=0.7.6 needs
  # elliptic-curve 0.14. Drop this entry once soroban-sdk moves to
  # elliptic-curve 0.14.
  "RUSTSEC-2026-0387",
]
