name: Testnet Dry Run Validation

on:
  pull_request:
    paths:
      - 'devx/testnet_dry_run.py'
      - 'devx/test_testnet_dry_run.py'
      - 'cli/src/dry-run.ts'
      - 'cli/test/dry-run.test.ts'
      - '.github/workflows/testnet-dry-run.yml'
  push:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
      
      - name: Run Python tests
        # Run from the repo root so `devx.testnet_dry_run` is importable.
        run: |
          python -m pytest devx/test_testnet_dry_run.py -v

  typescript-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: cli/package-lock.json
      
      - name: Install dependencies
        run: |
          cd cli
          npm ci
      
      - name: Run TypeScript tests
        run: |
          cd cli
          npx vitest run test/dry-run.test.ts

  lint-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      
      - name: Install flake8
        run: pip install flake8
      
      - name: Run flake8 on Python files
        run: |
          flake8 devx/testnet_dry_run.py devx/test_testnet_dry_run.py --max-line-length=100

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      
      - name: Install dependencies
        run: |
          cd cli
          npm ci
      
      - name: Run ESLint
        run: |
          cd cli
          npx eslint src/dry-run.ts

  dry-run-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      
      - name: Run Python dry run with valid input
        run: |
          echo '{
            "metadata": {
              "version": "v1",
              "timestamp": "2024-01-01T00:00:00Z",
              "hash": "abc123"
            },
            "payload": "test payload",
            "dependencies": []
          }' | python devx/testnet_dry_run.py
      
      - name: Run Python dry run with invalid input
        run: |
          echo '{
            "metadata": "invalid",
            "payload": "test payload"
          }' | python devx/testnet_dry_run.py || true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      
      - name: Install and build CLI
        run: |
          cd cli
          npm ci
          npm run build
      
      - name: Run TypeScript dry run with valid input
        run: |
          cd cli
          node dist/dry-run.js --payload "test payload" --version v1 --timestamp "2024-01-01T00:00:00Z" --hash "abc123"
      
      - name: Run TypeScript dry run with invalid input
        run: |
          cd cli
          node dist/dry-run.js --payload "test payload" --version v3 --timestamp "2024-01-01T00:00:00Z" --hash "abc123" || true